<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>探索岩稜與低矮灌叢｜互動知識實驗室</title><link rel="stylesheet" href="broadleaf-scene.css"><link rel="stylesheet" href="ridge-scene.css"></head><body>
<header><a href="ecosystem-alpine.html#peak">← 回到山地全景</a><span>岩稜與低矮灌叢</span><button id="overview" aria-pressed="false">看全景</button><button id="hint-toggle" aria-pressed="false">顯示探索提示</button></header>
<main><div class="intro"><h1>樹林退到身後，岩石間仍有生命。</h1><p>點選畫中的動植物，打開真實照片與觀察線索。<span class="mobile-tip">左右滑動，可以繼續走進岩稜。</span></p></div>
<div class="scene-shell" tabindex="0" role="region" aria-label="岩稜探索畫面；窄螢幕可左右捲動，也可用 Tab 選擇四種生物"><div class="scene" id="scene"><img class="scene-image" src="assets/ridge-scene.png" alt="岩稜與低矮灌叢概念插畫，有玉山圓柏、玉山杜鵑、岩鷚與金翼白眉。">
<button class="hotspot r-juniper" data-species="juniper" aria-label="探索玉山圓柏"><span>玉山圓柏</span><i aria-hidden="true">＋</i></button>
<button class="hotspot r-rhodo" data-species="rhodo" aria-label="探索玉山杜鵑"><span>玉山杜鵑</span><i aria-hidden="true">＋</i></button>
<button class="hotspot r-accentor" data-species="accentor" aria-label="探索岩鷚"><span>岩鷚</span><i aria-hidden="true">＋</i></button>
<button class="hotspot r-gold" data-species="gold" aria-label="探索金翼白眉"><span>金翼白眉</span><i aria-hidden="true">＋</i></button></div></div>
<footer><p class="art-note">AI 生態情境示意，近景便於觀察；非實拍、非特定山坡的共現紀錄。</p><div class="bottom"><span id="progress" role="status">已找到 0 / 4 種</span><details><summary>文字版入口</summary><div class="text-entries"><button data-species="juniper">玉山圓柏</button><button data-species="rhodo">玉山杜鵑</button><button data-species="accentor">岩鷚</button><button data-species="gold">金翼白眉</button></div></details></div></footer></main>
<dialog id="detail" aria-labelledby="detail-title"><button class="close" aria-label="返回岩稜">✕</button><div id="detail-content"></div></dialog><script src="ridge-scene.js"></script></body></html>
