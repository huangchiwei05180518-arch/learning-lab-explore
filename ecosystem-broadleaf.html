<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>走進山地闊葉林｜互動知識實驗室</title><link rel="stylesheet" href="broadleaf-scene.css"></head><body>
<header><a href="ecosystem-alpine.html#broad">← 回到山地全景</a><span>山地闊葉林</span><button id="overview" aria-pressed="false">看全景</button><button id="hint-toggle" aria-pressed="false">顯示探索提示</button></header>
<main><div class="intro"><h1>走進樹蔭下，找找誰在這裡。</h1><p>點選畫中的動植物，打開真實照片與觀察線索。<span class="mobile-tip">左右滑動，可以繼續走進森林。</span></p></div>
<div class="scene-shell" tabindex="0" role="region" aria-label="森林探索畫面；窄螢幕可左右捲動，也可用 Tab 選擇六種生物"><div class="scene" id="scene"><img class="scene-image" src="assets/broadleaf-scene-six.png" alt="臺灣山地闊葉林概念插畫，有青剛櫟、樟樹、藍腹鷴、臺灣獼猴、赤腹松鼠與山蘇花。">
<button class="hotspot oak" data-species="oak" aria-label="探索青剛櫟"><span>青剛櫟</span><i aria-hidden="true">＋</i></button>
<button class="hotspot camphor" data-species="camphor" aria-label="探索樟樹"><span>樟樹</span><i aria-hidden="true">＋</i></button>
<button class="hotspot bird" data-species="swinhoe" aria-label="探索藍腹鷴"><span>藍腹鷴</span><i aria-hidden="true">＋</i></button>
<button class="hotspot macaque" data-species="macaque" aria-label="探索臺灣獼猴"><span>臺灣獼猴</span><i aria-hidden="true">＋</i></button><button class="hotspot squirrel" data-species="squirrel" aria-label="探索赤腹松鼠"><span>赤腹松鼠</span><i aria-hidden="true">＋</i></button><button class="hotspot fern" data-species="fern" aria-label="探索山蘇花"><span>山蘇花</span><i aria-hidden="true">＋</i></button></div></div>
<footer><p class="art-note">AI 生態情境示意，植物局部放大便於觀察；非實拍、非現地共現紀錄。</p><div class="bottom"><span id="progress" role="status">已找到 0 / 6 種</span><details><summary>文字版入口</summary><div class="text-entries"><button data-species="oak">青剛櫟</button><button data-species="camphor">樟樹</button><button data-species="swinhoe">藍腹鷴</button><button data-species="macaque">臺灣獼猴</button><button data-species="squirrel">赤腹松鼠</button><button data-species="fern">山蘇花</button></div></details></div></footer></main>
<dialog id="detail" aria-labelledby="detail-title"><button class="close" aria-label="返回森林">✕</button><div id="detail-content"></div></dialog><script src="broadleaf-scene.js"></script></body></html>
